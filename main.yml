- name: Configure Fedora Workstation install
  hosts: all, localhost
  become: true

  pre_tasks:
    - name: Load configuration variables
      tags: always
      ansible.builtin.include_vars: "{{ item }}"
      loop:
        - config.yml

    - name: Update DNF cache
      when: ansible_facts["os_family"] == 'RedHat'
      ansible.builtin.dnf:
        update_cache: true

  tasks:
    - name: Fedora setup
      when: >
        (ansible_facts["distribution"] == 'Fedora')
      block:
        - name: Set up DNF
          ansible.builtin.import_tasks: tasks/dnf.yml

        - name: Install VS Code
          ansible.builtin.import_tasks: tasks/vscode.yml
          when: vscode

        - name: Install Tailscale
          ansible.builtin.import_tasks: tasks/tailscale.yml
          when: tailscale

        - name: Install Steam
          ansible.builtin.import_tasks: tasks/steam.yml
          when: gaymer

        - name: Install libvirt, add user to libvirt group
          ansible.builtin.import_tasks: tasks/virtualization.yml
          when: virtualization

        - name: Configure VFIO
          ansible.builtin.import_tasks: tasks/vfio.yml

        - name: Install Packages
          ansible.builtin.import_tasks: tasks/packages.yml

    - name: Set login shell to zsh
      when: zsh
      tags: zsh
      ansible.builtin.user:
        name: "{{ item }}"
        shell: /bin/zsh
      loop: "{{ [shell_user, 'root'] | unique }}"

    - name: Configure shell and dotfiles for root
      when: zsh
      tags: zsh
      ansible.builtin.include_role:
        name: shell
        apply:
          tags: zsh
      vars:
        shell_user: root

    - name: Set up i2c group, add user to i2c
      when: ansible_system == 'Linux'
      ansible.builtin.import_tasks: tasks/i2c.yml

  handlers:
    - name: Update dracut
      ansible.builtin.command: dracut --regenerate-all --force
      changed_when: true

- name: User configuration
  ansible.builtin.import_playbook: user.yml
