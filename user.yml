- name: User configuration
  hosts: all, localhost
  become: false

  pre_tasks:
    - name: Load configuration variables
      tags: always
      ansible.builtin.include_vars: 
        file: config.yml

  tasks:
    - name: Check if vscode installed and in path
      ansible.builtin.command: which code
      check_mode: false
      changed_when: false
      failed_when: code_installed.rc > 1
      register: code_installed

    - name: Configure vscode for user
      ansible.builtin.import_tasks: tasks/vscode-user.yml
      when: vscode and (code_installed.rc == 0)

    - name: Configure Linux systems
      when: ansible_system == 'Linux'
      block:
        - name: Get current desktop
          ansible.builtin.set_fact:
            desktop: "{{ lookup('env', 'XDG_CURRENT_DESKTOP') }}"

        - name: Configure LibreOffice
          ansible.builtin.import_tasks: tasks/libreoffice.yml

        - name: Configure Gnome
          when: desktop == "GNOME"
          ansible.builtin.include_tasks: tasks/gnome.yml

        - name: Configure ptyxis
          when: desktop == "GNOME"
          ansible.builtin.include_tasks: tasks/ptyxis.yml

    - name: Configure login shell and dotfiles
      when: zsh is defined and zsh
      tags: zsh
      ansible.builtin.include_role:
        name: shell
        apply:
          become_user: "{{ shell_user }}"
          tags: zsh
